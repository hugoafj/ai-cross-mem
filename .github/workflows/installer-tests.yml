name: Installer tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  installer-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run installer tests
        run: python -m unittest discover -s tests -v
